<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff8fb1" />
  <title>For My Love ♡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="sparkles" aria-hidden="true"></div>

  <main class="page-shell">
    <div class="top-note">A LITTLE CORNER OF THE WORLD, JUST FOR YOU <span>♡</span></div>

    <section class="love-card" aria-live="polite">
      <div class="progress" aria-label="Page progress"><span id="progressBar"></span></div>
      <p class="eyebrow" id="eyebrow">MY FAVORITE PERSON</p>

      <div class="heart-stage" id="heartStage">
        <button class="heart-button" id="heartButton" aria-label="Open my heart">
          <span class="heart">♥</span>
          <span class="heart-shine"></span>
        </button>
        <img class="story-image opening-image" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=900&q=85" alt="A romantic couple watching the sunset" />
        <p class="tap-hint">tap the heart, my love</p>
      </div>

      <div class="content-stage" id="contentStage" hidden>
        <div class="ornament" id="ornament">✧･ﾟ: *✧･ﾟ:* ♡ *:･ﾟ✧*:･ﾟ✧</div>
        <img class="story-image" id="storyImage" src="" alt="" />
        <h1 id="heading">For My Love</h1>
        <p class="subheading" id="subheading"></p>
        <div class="divider"><span>♡</span></div>
        <p class="message" id="message"></p>
      </div>

      <div class="controls">
        <button class="next-button" id="nextButton" hidden>Next little secret <span>♡</span></button>
        <p class="step-count" id="stepCount">A tiny love story · 1 of 5</p>
      </div>
    </section>

    <div class="music-pill" id="musicPill">
      <span class="music-note">♫</span>
      <span class="music-label"><strong>Prithibir Joto Sukh</strong><small id="musicStatus">Your love song · tap the heart to begin</small></span>
      <button id="musicToggle" type="button" aria-label="Play or pause song" title="Play or pause song">▶</button>
    </div>
    <div class="youtube-audio" id="youtubeAudio" aria-hidden="true"></div>
    <footer>made with all my heart <span>♥</span> for you</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
